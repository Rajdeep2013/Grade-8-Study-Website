<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome | Visionary Grade 8</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f4f7ff;background:#090f20}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 15%,#304b85 0,transparent 40%),radial-gradient(circle at 90% 90%,#28345b 0,transparent 42%),#090f20}.panel{width:min(100%,450px);padding:clamp(25px,6vw,45px);border-radius:25px;border:1px solid #455779;background:linear-gradient(155deg,#1d2b49,#101a30);box-shadow:0 30px 80px #0008}.brand{font-weight:800;letter-spacing:.13em;color:#9dbbff}.icon{font-size:45px;margin:22px 0 5px}h1{font-size:clamp(30px,6vw,40px);margin:8px 0}p{color:#b4c4df;line-height:1.6}label{display:block;margin-top:26px;margin-bottom:9px;font-weight:650}input{width:100%;padding:15px;border:1px solid #60739b;border-radius:13px;background:#0a1530;color:#fff;font-size:16px}input:focus{outline:2px solid #86a6ff}button{width:100%;padding:15px;border:0;border-radius:13px;background:#6484ff;color:#fff;font-size:16px;font-weight:750;margin-top:16px;cursor:pointer}button:hover{background:#7996ff}.error{color:#ffc1c1;min-height:20px;font-size:14px}.foot{font-size:12px;text-align:center;margin-top:20px}</style></head><body><main class="panel"><div class="brand">✦ VISIONARY / GRADE 8</div><div class="icon">📚</div><h1>Welcome, learner.</h1><p>Enter your name to open your personal study space. No password or Google account needed.</p><form id="entry"><label for="name">Your name</label><input id="name" name="name" maxlength="32" minlength="2" autocomplete="nickname" placeholder="e.g. Rajdeep" required><p id="error" class="error" role="alert"></p><button type="submit">Enter Study Hub →</button></form><p class="foot">Profiles and progress are stored only in this browser. Anyone using the same name on this device can open that profile.</p></main><script>
if(localStorage.getItem('v8profile'))location.replace('index.html');
document.getElementById('entry').addEventListener('submit',e=>{e.preventDefault();const n=document.getElementById('name').value.trim().replace(/\s+/g,' ');if(n.length<2){document.getElementById('error').textContent='Enter at least 2 characters.';return}localStorage.setItem('v8profile',n.toLocaleLowerCase());location.replace('index.html')});
</script></body></html>
